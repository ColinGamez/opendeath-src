# OpenDeath — open.death.cl
# Install at /etc/nginx/sites-available/open.death.cl, then symlink into sites-enabled.
# Run certbot after DNS points here: certbot --nginx -d open.death.cl

log_format opendeath_download '$request_method $uri $status';

server {
    listen 80;
    listen [::]:80;
    server_name open.death.cl;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name open.death.cl;

    root /var/www/open.death.cl;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/open.death.cl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open.death.cl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    # The live counter. The cron job rewrites this file; never cache it.
    location = /downloads.json {
        default_type application/json;
        expires -1;
        try_files $uri =404;
    }

    # Clean URLs. Pages live on disk as *.html; the address bar never shows it.
    # Keyed on $request_uri, not $uri: nginx rewrites / to /index.html internally,
    # and that internal hop must not be redirected back.
    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 https://$host/;
    }

    if ($request_uri ~ ^/(.+)\.html(\?.*)?$) {
        return 301 https://$host/$1$is_args$args;
    }

    # Release binaries. This log is the counter's source of truth.
    location /downloads/ {
        access_log /var/log/nginx/opendeath-downloads.log opendeath_download;
        expires 1y;
        try_files $uri =404;
    }

    # Short pointers beside the binaries. electron-updater reads latest.yml to find a new version, so a cached copy
    # would pin every installed build to the release it first saw. The checksum file moves with it.
    location = /downloads/latest.yml {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /downloads/SHA256SUMS.txt {
        expires -1;
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        # Pages must revalidate on every visit: no heuristic freshness on HTML.
        # add_header does not inherit once a level defines its own, so the
        # server-level security headers are repeated here.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # The error page has a clean address too, and it must keep answering 404.
    location = /404 {
        return 404;
    }
}
