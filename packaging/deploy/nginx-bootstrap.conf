# Temporary HTTP-only server block used only to obtain the TLS certificate.
# Replace it with nginx.conf after certbot succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name open.death.cl;

    root /var/www/open.death.cl;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
